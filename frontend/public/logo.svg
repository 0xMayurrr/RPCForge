<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <rect width="44" height="44" rx="12" fill="#6467f2"/>
  <rect width="44" height="44" rx="12" fill="url(#grad)"/>
  <!-- Chain links / RPC nodes -->
  <circle cx="14" cy="22" r="5" fill="white" opacity="0.95"/>
  <circle cx="30" cy="22" r="5" fill="white" opacity="0.95"/>
  <rect x="19" y="20" width="6" height="4" rx="2" fill="white" opacity="0.95"/>
  <!-- Top node -->
  <circle cx="22" cy="11" r="3.5" fill="white" opacity="0.7"/>
  <line x1="22" y1="14.5" x2="22" y2="17" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Bottom node -->
  <circle cx="22" cy="33" r="3.5" fill="white" opacity="0.7"/>
  <line x1="22" y1="27" x2="22" y2="29.5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c7ff5"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
</svg>
